name: _renovate

on:
  schedule:
    - cron: '53 */4 * * *' # every 4 hours every day on minute 53
  workflow_dispatch:
    inputs:
      dry-run:
        default: none
        options:
          - none
          - extract
          - lookup
          - full
        required: false
        type: choice
      log-level:
        default: info
        options:
          - info
          - debug
        required: false
        type: choice

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 55 # github app token expires in 60m
    steps:
      - name: sleep for 5 minutes
        if: github.event_name == 'workflow_dispatch'
        run: sleep 300

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: get github app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_BOT_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.RENOVATE_BOT_APP_PRIVATE_KEY }}

      - name: run renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          configurationFile: .github/renovate/renovate-global-config.json
          renovate-image: renovate/renovate@sha256:8a79148ec24cc05809782e20e720dafe9dde0c24a00f26e76d14dec2cbd74a53
          renovate-version: 44.151.0
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry-run != 'none' && inputs.dry-run || '' }} # empty on scheduled runs, which Renovate treats as unset
