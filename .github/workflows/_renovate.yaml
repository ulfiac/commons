name: _renovate

on:
  schedule:
    - cron: '53 */4 * * *' # every 4 hours every day on minute 53
  workflow_dispatch:
    inputs:
      dry-run:
        default: none
        options:
          - none
          - extract
          - lookup
          - full
        required: false
        type: choice
      log-level:
        default: info
        options:
          - info
          - debug
        required: false
        type: choice

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 55 # github app token expires in 60m
    steps:
      - name: sleep for 5 minutes
        if: github.event_name == 'workflow_dispatch'
        run: sleep 300

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: get github app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_BOT_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.RENOVATE_BOT_APP_PRIVATE_KEY }}

      - name: run renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: .github/renovate/renovate-global-config.json
          renovate-image: renovate/renovate@sha256:a3bb448e88ac8517754beccbde3a5621e41eced3f3e4e61c1f6db0ced2affb37
          renovate-version: 44.182.2
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry-run != 'none' && inputs.dry-run || '' }} # empty on scheduled runs, which Renovate treats as unset
